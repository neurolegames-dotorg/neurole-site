# GitHub Pages build configuration
#
# NOTE (2026-08): the live website is the React app in `neurole-react/`, which
# is deployed as its own Vercel project (framework "vite", output `dist/`). The
# repo root no longer contains the static site, so this _config.yml only guards
# against a hypothetical re-deploy of the repo root via GitHub Pages.
#
# If the root ever IS published on Pages: it runs Jekyll by default (there is
# no `.nojekyll` file), and `exclude` below is what it honours. Nothing is
# deleted — excluded paths stay in git and come back the moment they are
# removed from this list. Verify after changing anything here: the Pages build
# must succeed, or the site silently stops updating.
#
# NOTE: `.vercelignore` and `.assetsignore` are the other two twins of this
# list. Jekyll's `exclude` does nothing on Vercel or Cloudflare and vice versa,
# so a path added to one almost always belongs in all three — keep them in sync.

exclude:
  # --- Jekyll's own defaults -------------------------------------------
  # Declaring `exclude` REPLACES the built-in list rather than adding to it,
  # so these have to be repeated or they start being published.
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

  # --- Non-deployed assets ---------------------------------------------
  # The designated archive/dump folder: every image, spreadsheet and zip.
  # Stays out of any root-served deployment.
  #
  # The duplicate whole-site copy that used to need an entry here has been
  # deleted outright rather than merely hidden. Deleting beats excluding: an
  # exclusion only stops Pages publishing the files, while anyone reading the
  # repo still sees them, and one edit to this list puts them back on the web.
  - assets/

  # --- Question banks ----------------------------------------------------
  # The case and quiz banks, including answers. All live under assets/ — never
  # publish them from the root; the live games read the published Google Sheet
  # CSV instead, so publishing them just hands players the answer key.
  - "*.xlsx"

  # --- Source archives ---------------------------------------------------
  # The archives themselves are gone; the glob stays as a standing guard, so a
  # zip dropped in by a future upload is never published even before anyone
  # notices it landed.
  - "*.zip"

  # --- React app ---------------------------------------------------------
  # The actual website: source, not build output. Deployed as its own Vercel
  # project. Serving it from the root would expose the whole codebase.
  - neurole-react/

  # --- Not part of the website -------------------------------------------
  # Cloudflare Worker source; lives at neurole-react/scripts/ai-worker.js and
  # runs on Cloudflare, never fetched by a browser.
  - wrangler.jsonc
  # Tooling and docs.
  - package.json
  - package-lock.json
  # Every markdown file in the root is a note or a readme for whoever is
  # working on the repo — none is a page. Named as well as globbed, for the
  # same File.fnmatch reason as the .xlsx entries above.
  - README.md
  - NOTES-brain-essay-embed.md
  - WEBSITE-SETUP-AND-ORGANIZATION.md
  - "*.md"

  # --- Other platforms' config -------------------------------------------
  # Would otherwise be served as a plain static file from the site root.
  - vercel.json